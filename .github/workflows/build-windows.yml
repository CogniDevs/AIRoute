name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows Binary & Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
        shell: pwsh

      - name: Install NSIS
        run: |
          choco install nsis -y
        shell: pwsh

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
        shell: pwsh

      - name: Build Application with NSIS Installer
        run: |
          wails build -platform windows/amd64 -nsis
        shell: pwsh

      - name: Collect Windows Artifacts
        run: |
          New-Item -ItemType Directory -Force -Path release-dist
          Copy-Item -Path "build\bin\airoute.exe" -Destination "release-dist\AIRoute_Windows_Portable.exe" -Force
          $installer = Get-ChildItem -Path "build\bin" -Filter "*installer*.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item -Path $installer.FullName -Destination "release-dist\AIRoute_Windows_Installer.exe" -Force
            Write-Host "Found installer: $($installer.FullName)"
          } else {
            Write-Error "NSIS installer was not generated in build/bin!"
            exit 1
          }
        shell: pwsh

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIRoute_Windows
          path: release-dist/*

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
